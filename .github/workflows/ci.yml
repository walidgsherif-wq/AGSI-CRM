# CI — typecheck/lint/build on PR, auto-apply migrations on merge,
# verify committed == applied, and a daily drift detector.
#
# Why this file exists:
#   Migrations used to be hand-pasted into the Supabase SQL editor
#   and confirmed verbally. That guarantees an eventual
#   "committed-but-not-applied" gap. This workflow closes it by
#   running `supabase db push` on every push to main, then asserting
#   that the supabase_migrations.schema_migrations table matches
#   the files in supabase/migrations/. The daily cron catches the
#   inverse failure mode — schema edits made directly in Studio
#   that have no migration file.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF    The project ref from the dashboard URL.
#   SUPABASE_ACCESS_TOKEN   Personal access token from
#                           https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    The database password (Project Settings →
#                           Database → Database Password). NOT the
#                           anon / service-role API key.
#   SUPABASE_DB_URL         Session-pooler connection string. Copy from
#                           Project Settings → Database → Connection
#                           string → "Session pooler" tab. Looks like:
#                             postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#                           Used because GitHub Actions runners are
#                           IPv4-only and db.<ref>.supabase.co resolves
#                           IPv6-only — the direct host is unreachable
#                           from CI. The pooler is IPv4-reachable.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily drift detector — 09:00 UTC = 13:00 Dubai.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      confirm_ledger_repair:
        description: 'Type "yes" to run the one-time ledger-repair job (marks every local migration as applied in supabase_migrations.schema_migrations without executing any DDL). Leave blank for a normal manual run.'
        required: false
        default: ''
        type: string
      smoke_test_drift:
        description: 'Type "yes" to run the verify-gate smoke test (injects a phantom version into the local list in-memory and asserts the diff fires — does NOT touch prod or write any file).'
        required: false
        default: 'no'
        type: string

# Don't cancel an in-progress migration apply if a new commit lands —
# half-applied schema is worse than waiting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────
  # PR check — typecheck, lint, build. No DB access. Blocks merge if
  # any of these fail.
  # ───────────────────────────────────────────────────────────────────
  pr-check:
    if: github.event_name == 'pull_request'
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # The Next config validates env via a zod schema at build
          # time; CI doesn't have the runtime secrets and doesn't
          # need them to verify the build compiles.
          SKIP_ENV_VALIDATION: '1'

  # ───────────────────────────────────────────────────────────────────
  # Apply pending migrations against the linked Supabase project. Runs
  # on every push to main (i.e. every squash-merge). Replaces the
  # manual SQL-editor paste.
  # ───────────────────────────────────────────────────────────────────
  apply-migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pin, not `latest`. The supabase CLI's config.toml schema
          # had two breaking changes after this version:
          #   - May 2025: [[storage.buckets]] (table-array, with
          #     `name = "..."` field) was replaced by
          #     [storage.buckets.<bucket>] (map keyed on bucket name).
          #   - Around the same era: top-level [auth].enable_confirmations
          #     was removed (only [auth.email].enable_confirmations
          #     is still accepted).
          # v1.226.4 is the last v1.x release (Dec 3, 2024) — it
          # parses our config.toml cleanly and has every --linked
          # subcommand used below (db push, migration list, db diff).
          # If we ever need a newer CLI we'll migrate config.toml at
          # the same time, in a single intentional PR.
          version: 1.226.4

      - name: Link to prod project
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        # No-op if everything's already applied; otherwise applies
        # only the ones missing from supabase_migrations.schema_migrations.
        run: |
          supabase db push \
            --linked \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

  # ───────────────────────────────────────────────────────────────────
  # Tripwire: query supabase_migrations.schema_migrations directly via
  # psql and fail if any local migration isn't applied, or vice versa.
  # Runs after the apply step so a successful apply gets verified
  # end-to-end; if anything mismatches here it's a genuine bug in the
  # apply path.
  #
  # We bypass `supabase migration list --linked` here for the same
  # reason as the repair job — in CLI v1.226.4, "Unknown config field"
  # warnings + the upgrade notice land on stdout in some run paths,
  # break the awk parser, and silently emit an empty drift set
  # (false-positive "OK" — worst-possible failure mode for a gate).
  # Direct SQL via the pooler is unambiguous.
  # ───────────────────────────────────────────────────────────────────
  verify-migrations-in-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Verify committed == applied
    needs: apply-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Diff committed vs applied
        # diff -u between the local migration filenames and the ledger:
        # `-` lines are committed-but-not-applied, `+` lines are
        # applied-but-not-committed. Either fails the job.
        run: |
          set -euo pipefail

          psql "$SUPABASE_DB_URL" -t -A \
            -c "select version from supabase_migrations.schema_migrations order by version;" \
            | grep -E '^[0-9]+$' \
            | sort -u > /tmp/remote-versions.txt

          ls supabase/migrations/*.sql \
            | xargs -n1 basename \
            | sed -E 's/\.sql$//' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | grep -E '^[0-9]+$' \
            | sort -u > /tmp/local-versions.txt

          if ! diff -u /tmp/local-versions.txt /tmp/remote-versions.txt; then
            echo "::error::Migration drift detected — '-' lines are committed-but-not-applied, '+' lines are applied-but-not-committed."
            exit 1
          fi
          echo "OK — $(wc -l < /tmp/local-versions.txt) versions in sync."

  # ───────────────────────────────────────────────────────────────────
  # Daily drift detector — catches schema changes made directly in the
  # SQL editor (which won't show up as a missing migration but WILL
  # diverge the live schema from the migration history). Also runs on
  # workflow_dispatch so you can fire it manually after suspected
  # out-of-band edits.
  # ───────────────────────────────────────────────────────────────────
  drift-detector:
    # On schedule (daily) or on a plain workflow_dispatch (with no
    # ledger-repair or smoke-test input). Dispatches that target the
    # repair or smoke jobs have different purposes; running drift
    # detection alongside is just noise.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm_ledger_repair != 'yes' &&
       github.event.inputs.smoke_test_drift != 'yes')
    name: Daily schema drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # See pin rationale on the apply-migrations job above.
          version: 1.226.4

      - name: Link to prod project
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Diff prod schema vs migrations (public schema)
        # `supabase db diff --linked` emits the SQL needed to bring the
        # linked DB in line with the migration history. Empty output =
        # in sync; non-empty = someone touched the schema outside the
        # migration files.
        run: |
          set -euo pipefail
          DIFF=$(supabase db diff --linked --schema public)
          if [ -n "$DIFF" ]; then
            echo "::error::Schema drift detected — prod schema differs from migrations:"
            echo "$DIFF"
            exit 1
          fi
          echo "OK — prod schema matches the public migrations."

      - name: Diff prod schema vs migrations (storage schema)
        # Storage RLS lives in storage.objects policies. Worth a
        # separate diff so a hand-edited policy doesn't silently
        # diverge.
        run: |
          set -euo pipefail
          DIFF=$(supabase db diff --linked --schema storage)
          if [ -n "$DIFF" ]; then
            echo "::error::Schema drift detected on storage schema:"
            echo "$DIFF"
            exit 1
          fi
          echo "OK — prod storage schema matches the migrations."

  # ───────────────────────────────────────────────────────────────────
  # ONE-TIME ledger repair. The session's migrations were applied by
  # pasting SQL into the Supabase editor, which runs DDL but does NOT
  # write a row into supabase_migrations.schema_migrations. So the
  # live schema is fully at 0083, but the ledger only has 0001, and
  # `db push` therefore tries to re-apply 0002–0083 → "type role_t
  # already exists".
  #
  # This job loops over supabase/migrations/*.sql and marks each
  # version as APPLIED in the ledger via `supabase migration repair
  # --status applied <version>`. That command updates the ledger
  # only — it executes no DDL. Re-marking 0001 (already applied) is
  # a harmless no-op, so the job is idempotent.
  #
  # Gated on workflow_dispatch + `confirm_ledger_repair == 'yes'`, so
  # it cannot fire on push / PR / schedule. After it runs once and
  # apply-migrations reports "no migrations to apply" on the next
  # push, this job can stay dormant (or be removed in a follow-up).
  # ───────────────────────────────────────────────────────────────────
  repair-migration-ledger:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_ledger_repair == 'yes'
    name: One-time — mark local migrations as applied in the prod ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Session-pooler connection string. The previous direct-DB
      # approach (db.<ref>.supabase.co:5432) resolves to an IPv6-only
      # address; GitHub Actions runners are IPv4-only, so psql got
      # "Network is unreachable" on every call. The pooler endpoint
      # (aws-0-<region>.pooler.supabase.com) is IPv4-reachable, so
      # routing every psql call through it fixes the reachability
      # bug. We use the SESSION pooler (port 5432) rather than
      # transaction-pooler (6543) for compatibility — session mode
      # supports the full set of psql features.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # See pin rationale on the apply-migrations job above.
          version: 1.226.4

      - name: Sanity check — psql can reach prod
        # Fail loudly here if the pooler is unreachable (wrong URL,
        # network issue). Catches the failure mode where every
        # downstream step would silently see an empty result set.
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -c "SELECT 1;" >/dev/null
          echo "OK — psql connected via the session pooler."

      - name: Link to prod project (for migration repair calls)
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Show ledger BEFORE repair (via direct SQL)
        # psql -t -A = tuples only, unaligned. One version per line,
        # nothing else. Stderr is not captured, so warnings/notices
        # can't contaminate the output.
        run: |
          set -euo pipefail
          echo "Versions in supabase_migrations.schema_migrations:"
          psql "$SUPABASE_DB_URL" -t -A \
            -c "select version from supabase_migrations.schema_migrations order by version;" \
            | grep -E '^[0-9]+$' \
            || echo "  (none)"

      - name: Mark MISSING local migrations as applied (no DDL)
        # Belt + braces idempotency:
        #   1) Pre-query the ledger via psql (source of truth) to
        #      build REMOTE_VERSIONS. No CLI table-text scrape.
        #   2) Loop over supabase/migrations/*.sql. For each numeric
        #      version, skip if already in REMOTE_VERSIONS; otherwise
        #      call `migration repair --status applied`.
        #   3) If the pre-query somehow missed a version, the per-call
        #      handler catches 23505 (`duplicate key value violates
        #      unique constraint`) and treats it as success. Any other
        #      error still fails the job.
        #
        # Re-running after a clean pass is a true no-op: every
        # iteration takes the "already recorded" branch.
        run: |
          set -euo pipefail

          REMOTE_VERSIONS=$(psql "$SUPABASE_DB_URL" -t -A \
            -c "select version from supabase_migrations.schema_migrations order by version;" \
            | grep -E '^[0-9]+$' \
            | sort -u)
          echo "── Versions already in the ledger ──"
          if [ -z "$REMOTE_VERSIONS" ]; then
            echo "  (none)"
          else
            echo "$REMOTE_VERSIONS"
          fi
          echo "────────────────────────────────────"

          marked=0
          already=0
          dup_tolerated=0
          skipped=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f" .sql)
            version="${base%%_*}"
            if [[ ! "$version" =~ ^[0-9]+$ ]]; then
              echo "  skip (non-numeric prefix): $base"
              skipped=$((skipped + 1))
              continue
            fi
            if echo "$REMOTE_VERSIONS" | grep -qx "$version"; then
              echo "  already recorded:  $version  ($base)"
              already=$((already + 1))
              continue
            fi
            echo "  mark applied:      $version  ($base)"
            if ! out=$(supabase migration repair \
                         --status applied \
                         --password "${{ secrets.SUPABASE_DB_PASSWORD }}" \
                         "$version" 2>&1); then
              if echo "$out" | grep -qi 'duplicate key value violates unique constraint'; then
                echo "    (already recorded after all — treating as success)"
                dup_tolerated=$((dup_tolerated + 1))
                continue
              fi
              echo "::error::repair failed for $version"
              echo "$out"
              exit 1
            fi
            marked=$((marked + 1))
          done
          echo ""
          echo "Summary: marked $marked, already recorded $already, dup-tolerated $dup_tolerated, skipped $skipped."

      - name: Show ledger AFTER repair (via direct SQL)
        run: |
          set -euo pipefail
          echo "Versions in supabase_migrations.schema_migrations:"
          psql "$SUPABASE_DB_URL" -t -A \
            -c "select version from supabase_migrations.schema_migrations order by version;" \
            | grep -E '^[0-9]+$'

      - name: Assert ledger now in sync (psql diff)
        # Compare the applied version set (read via psql) to the
        # local migration files. diff -u surfaces both directions:
        # `-` lines are committed-but-not-applied, `+` lines are
        # applied-but-not-committed. Either one fails the job.
        run: |
          set -euo pipefail

          psql "$SUPABASE_DB_URL" -t -A \
            -c "select version from supabase_migrations.schema_migrations order by version;" \
            | grep -E '^[0-9]+$' \
            | sort -u > /tmp/remote-versions.txt

          ls supabase/migrations/*.sql \
            | xargs -n1 basename \
            | sed -E 's/\.sql$//' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | grep -E '^[0-9]+$' \
            | sort -u > /tmp/local-versions.txt

          if ! diff -u /tmp/local-versions.txt /tmp/remote-versions.txt; then
            echo "::error::Ledger not fully reconciled — '-' lines are committed-but-not-applied, '+' lines are applied-but-not-committed."
            exit 1
          fi
          echo "OK — $(wc -l < /tmp/local-versions.txt) versions in sync."

  # ───────────────────────────────────────────────────────────────────
  # Smoke test for the verify-migrations-in-sync gate. Reuses the EXACT
  # psql query + filename-extraction + `diff -u` logic, but injects a
  # phantom "0099" version into the local list in-memory before running
  # the diff. The diff MUST fire (exit non-zero); if it doesn't, the
  # real gate is broken and the smoke job fails loudly.
  #
  # Safety:
  #   - Gated on workflow_dispatch + smoke_test_drift == 'yes'. Never
  #     fires on push / PR / schedule. Drift-detector and ledger-repair
  #     jobs skip on this dispatch (their `if` clauses check the input).
  #   - Reads supabase_migrations.schema_migrations but writes NOTHING.
  #     No `migration repair`, no `db push`, no INSERTs.
  #   - The phantom "0099" exists ONLY as a line in /tmp/...phantom.txt
  #     inside the runner. Nothing is created under supabase/migrations/.
  # ───────────────────────────────────────────────────────────────────
  smoke-test-verify-gate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.smoke_test_drift == 'yes'
    name: Smoke test — prove the verify gate catches injected drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject phantom 0099 and run the real gate logic
        run: |
          set -euo pipefail

          PHANTOM="0099"

          # Mirror the real gate: read schema_migrations via psql.
          psql "$SUPABASE_DB_URL" -t -A \
            -c "select version from supabase_migrations.schema_migrations order by version;" \
            | grep -E '^[0-9]+$' \
            | sort -u > /tmp/remote-versions.txt

          # Mirror the real gate: build local-versions from filenames.
          ls supabase/migrations/*.sql \
            | xargs -n1 basename \
            | sed -E 's/\.sql$//' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | grep -E '^[0-9]+$' \
            | sort -u > /tmp/local-versions-real.txt

          # Sanity: PHANTOM must not collide with reality, otherwise
          # "injecting" it changes nothing and the test is vacuous.
          if grep -qx "$PHANTOM" /tmp/local-versions-real.txt; then
            echo "::error::Phantom $PHANTOM is already a real local migration. Bump PHANTOM and re-run."
            exit 1
          fi
          if grep -qx "$PHANTOM" /tmp/remote-versions.txt; then
            echo "::error::Phantom $PHANTOM is already in the ledger. Bump PHANTOM and re-run."
            exit 1
          fi

          # Inject — append PHANTOM to the local list in a NEW file.
          # /tmp/local-versions-real.txt is untouched; no file is
          # created under supabase/migrations/.
          (cat /tmp/local-versions-real.txt; echo "$PHANTOM") \
            | sort -u > /tmp/local-versions-with-phantom.txt

          echo "── Local + phantom (in-memory) ──"
          cat /tmp/local-versions-with-phantom.txt
          echo "── Remote (real ledger) ──"
          cat /tmp/remote-versions.txt
          echo ""
          echo "Running the real gate's `diff -u` against the injected list..."

          # The EXACT failure check from verify-migrations-in-sync,
          # against the phantom-injected file. We want it to fire:
          # diff -u returns non-zero → real gate would have errored.
          if diff -u /tmp/local-versions-with-phantom.txt /tmp/remote-versions.txt > /tmp/diff-out.txt; then
            echo "::error::SMOKE TEST FAILED — gate did NOT catch injected phantom $PHANTOM."
            echo "The real verify-migrations-in-sync would have falsely reported 'OK' on a real $PHANTOM drift. Investigate immediately."
            exit 1
          fi

          # Belt-and-braces: confirm the diff specifically flagged
          # PHANTOM as committed-but-not-applied (a `-` line).
          if ! grep -qx "-$PHANTOM" /tmp/diff-out.txt; then
            echo "::error::SMOKE TEST FAILED — diff fired but did not flag $PHANTOM as committed-but-not-applied."
            cat /tmp/diff-out.txt
            exit 1
          fi

          echo ""
          echo "SMOKE TEST PASSED — gate correctly caught injected phantom $PHANTOM as committed-but-not-applied."
          echo "The real verify-migrations-in-sync would have fired '::error::Migration drift detected …' here."
